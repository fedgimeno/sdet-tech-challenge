server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /sdet_challenge_api.yaml {
        try_files $uri =404;
    }

    # Preserve the environment prefix, request body, and authentication header.
    location ~ ^/(dev|prod)(/|$) {
        proxy_pass http://sdet-api:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://swagger-ui:8080;
        proxy_set_header Host $host;
    }
}
